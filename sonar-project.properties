# =============================================================================
# Configuracion de SonarQube para Taller Mecanico Web
# =============================================================================

sonar.projectKey=taller_mecanico1
sonar.projectName=Taller Mecánico Web
sonar.projectVersion=2.0

# Codigo fuente a analizar
sonar.sources=classicmodels-web
sonar.tests=classicmodels-web/test

# Exclusiones criticas (evita escanear reportes autogenerados y librerias externas)
sonar.exclusions=\
  classicmodels-web/coverage/**,\
  classicmodels-web/node_modules/**,\
  classicmodels-web/serviceAccountKey.json,\
  **/node_modules/**,\
  **/*.test.js

# Pruebas y Cobertura
sonar.test.inclusions=classicmodels-web/test/**/*.js
sonar.coverage.exclusions=classicmodels-web/public/**,classicmodels-web/migrar-a-firebase.js
sonar.javascript.lcov.reportPaths=classicmodels-web/coverage/lcov.info

# Codificacion
sonar.sourceEncoding=UTF-8
